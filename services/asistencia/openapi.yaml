openapi: 3.0.3
info:
  title: SIGECAT — Asistencia
  version: 1.0.0
  description: |
    Microservicio de Asistencia: sesiones de catequesis y misa, registros de asistencia y señal de riesgo.

    **Reglas de negocio**
    - Solo `ausente` cuenta como falta. `tardanza` cuenta como asistencia y `justificado` no suma faltas.
    - Riesgo: 0–1 faltas → `bajo`; 2 → `medio` (se conversa con el apoderado); 3 o más → `alto` (umbral de retiro).
    - Idempotencia: sesiones y registros llevan un id generado en el cliente. Reenviar el mismo lote no duplica nada (upsert por id).
    - Este servicio **no** consulta al de Catequizandos: solo guarda `catequizandoId` y `grupoId` como referencia
      (consistencia eventual, declarada en la sustentación).
servers:
  - url: /
    description: Sin host fijo. Local http://localhost:3002; en la nube, la URL base del gateway (sufijo `asis`).
security:
  - claveDeSuscripcion: []
tags:
  - name: Sistema
    description: Salud del servicio.
  - name: Asistencia
    description: Pases de lista, historial y señal de riesgo.
paths:
  /health:
    get:
      tags: [Sistema]
      operationId: health
      summary: Estado del servicio
      responses:
        "200":
          description: El servicio está vivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: { status: ok, servicio: asistencia }
  /pases-de-lista:
    post:
      tags: [Asistencia]
      operationId: pasarLista
      summary: Guarda una sesión con todos sus registros
      description: |
        Upsert por id: la sesión y cada registro se crean o se reemplazan según su `id`.
        Reenviar el mismo lote devuelve el mismo resultado y no duplica nada.
        Un catequizando solo puede aparecer una vez por sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaseDeListaEntrada"
            example:
              sesion:
                id: 6f1d2c1e-3b1a-4c55-9f0e-1d2a3b4c5d6e
                grupoId: grp-8
                fecha: "2026-09-28"
                tipo: catequesis
                tema: El Padrenuestro
              registros:
                - id: 0b9f7a52-5a56-4f57-8f6a-0d8f6b3c2a11
                  catequizandoId: cat-001
                  estado: presente
                - id: 3c4d5e6f-7a8b-49c0-a1d2-e3f4a5b6c7d8
                  catequizandoId: cat-003
                  estado: ausente
              registradoPor: C1
      responses:
        "201":
          description: Guardado (también al reenviar el mismo lote)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaseDeListaResultado"
              example: { sesionId: 6f1d2c1e-3b1a-4c55-9f0e-1d2a3b4c5d6e, registrosGuardados: 2 }
        "400":
          $ref: "#/components/responses/Validacion"
  /catequizandos/{id}/registros:
    get:
      tags: [Asistencia]
      operationId: historialDeAsistencia
      summary: Historial de asistencia de un catequizando
      description: |
        Del más antiguo al más reciente. Si el catequizando no tiene registros (o no existe en el otro
        contexto) devuelve una lista vacía: este servicio no verifica su existencia.
      parameters:
        - $ref: "#/components/parameters/CatequizandoId"
      responses:
        "200":
          description: Historial
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntradaDeHistorial"
              example:
                - { fecha: "2026-09-06", tipo: misa, estado: presente }
                - { fecha: "2026-09-13", tipo: catequesis, estado: ausente }
  /catequizandos/{id}/riesgo:
    get:
      tags: [Asistencia]
      operationId: senalDeRiesgo
      summary: Señal de riesgo calculada al momento
      parameters:
        - $ref: "#/components/parameters/CatequizandoId"
      responses:
        "200":
          description: Señal de riesgo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenalRiesgo"
              example:
                catequizandoId: cat-007
                nivel: alto
                motivos:
                  - 3 ausencias sin justificar
                  - Alcanza el umbral de retiro (3 o más faltas)
                calculadoEn: "2026-09-28T12:00:00.000Z"
components:
  securitySchemes:
    claveDeSuscripcion:
      type: apiKey
      in: header
      name: Ocp-Apim-Subscription-Key
      description: Lo exige el gateway (APIM), no el servicio. Sin clave el gateway responde 401.
  parameters:
    CatequizandoId:
      name: id
      in: path
      required: true
      description: Identidad del catequizando en el contexto Catequizandos (p. ej. `cat-003`).
      schema:
        type: string
        example: cat-003
  responses:
    Validacion:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: VALIDACION, message: "registro.estado debe ser uno de: presente, tardanza, ausente, justificado (registro x)" }
  schemas:
    Health:
      type: object
      required: [status, servicio]
      properties:
        status: { type: string, example: ok }
        servicio: { type: string, example: asistencia }
    EstadoAsistencia:
      type: string
      enum: [presente, tardanza, ausente, justificado]
    TipoSesion:
      type: string
      description: "[PROPUESTA] no existe en modelo.ts; la cartilla de la parroquia sí distingue misa de catequesis."
      enum: [misa, catequesis]
    SesionEntrada:
      type: object
      required: [id, grupoId, fecha, tipo]
      properties:
        id: { type: string, description: Generado en el cliente }
        grupoId: { type: string, example: grp-8 }
        fecha: { type: string, format: date, example: "2026-09-28" }
        tipo: { $ref: "#/components/schemas/TipoSesion" }
        tema: { type: string }
    RegistroEntrada:
      type: object
      required: [id, catequizandoId, estado]
      properties:
        id: { type: string, description: Generado en el cliente }
        sesionId:
          type: string
          description: Opcional. Si viene, debe coincidir con `sesion.id`.
        catequizandoId: { type: string, example: cat-001 }
        estado: { $ref: "#/components/schemas/EstadoAsistencia" }
        registradoEn:
          type: string
          format: date-time
          description: Opcional. Instante real de la toma; si falta, se usa la hora del servidor.
    PaseDeListaEntrada:
      type: object
      required: [sesion, registros, registradoPor]
      properties:
        sesion: { $ref: "#/components/schemas/SesionEntrada" }
        registros:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RegistroEntrada" }
        registradoPor:
          type: string
          description: Identidad operativa; seudónimo si el catequista es menor (p. ej. `C1`).
          example: C1
    PaseDeListaResultado:
      type: object
      required: [sesionId, registrosGuardados]
      properties:
        sesionId: { type: string }
        registrosGuardados: { type: integer, minimum: 0 }
    EntradaDeHistorial:
      type: object
      required: [fecha, tipo, estado]
      properties:
        fecha: { type: string, format: date }
        tipo: { $ref: "#/components/schemas/TipoSesion" }
        estado: { $ref: "#/components/schemas/EstadoAsistencia" }
    SenalRiesgo:
      type: object
      required: [catequizandoId, nivel, motivos, calculadoEn]
      properties:
        catequizandoId: { type: string }
        nivel:
          type: string
          enum: [bajo, medio, alto]
        motivos:
          type: array
          description: Explica el cálculo. El primer elemento siempre es el conteo de ausencias sin justificar.
          items: { type: string }
        calculadoEn: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDACION, NO_ENCONTRADO]
            message: { type: string }
